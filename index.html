<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>White Noise With Night Light</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="description" content="A quiet instrument designed to support calm, focus, and rest." />

<style>
:root {
  --bg: #05070d;
  --light-main: rgba(120,140,255,0.85);
  --light-soft: rgba(120,140,255,0.35);
  --text-dim: rgba(255,255,255,0.55);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}

/* ---------- SCENE ---------- */

.scene {
  position: relative;
  width: 100%;
  height: 100%;
}

/* ---------- LIGHT ORB ---------- */

.orb {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 40%),
    radial-gradient(circle at 70% 70%, rgba(140,160,255,0.45), transparent 45%),
    radial-gradient(circle, #4a5cff, #0a0e2a 70%);
  box-shadow:
    0 0 120px rgba(90,110,255,0.35),
    inset 0 0 60px rgba(255,255,255,0.2);
  animation: breathe 9s ease-in-out infinite;
}

/* ---------- SOUND WAVES ---------- */

.waves {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

.wave {
  position: absolute;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  border: 1px solid rgba(120,140,255,0.18);
  animation: ripple 14s linear infinite;
}

.wave:nth-child(2) {
  width: 520px;
  height: 520px;
  animation-delay: 4s;
}

.wave:nth-child(3) {
  width: 640px;
  height: 640px;
  animation-delay: 8s;
}

/* ---------- TEXT ---------- */

.text {
  position: absolute;
  left: 50%;
  bottom: 18%;
  transform: translateX(-50%);
  text-align: center;
  color: white;
  letter-spacing: 0.4px;
}

.text div {
  font-size: 15px;
  color: var(--text-dim);
  opacity: 0;
  animation: textFade 18s infinite;
}

.text div:nth-child(2) {
  animation-delay: 6s;
}

.text div:nth-child(3) {
  animation-delay: 12s;
}

/* ---------- FOOTER LINKS ---------- */

.footer {
  position: absolute;
  bottom: 22px;
  width: 100%;
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.35);
}

.footer a {
  margin: 0 10px;
  color: rgba(255,255,255,0.35);
  text-decoration: none;
}

/* ---------- ANIMATIONS ---------- */

@keyframes breathe {
  0%   { transform: translate(-50%, -50%) scale(1); }
  50%  { transform: translate(-50%, -50%) scale(1.08); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

@keyframes ripple {
  0% {
    opacity: 0;
    transform: scale(0.85);
  }
  20% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: scale(1.15);
  }
}

@keyframes textFade {
  0%, 30% { opacity: 0; }
  40%, 60% { opacity: 1; }
  70%, 100% { opacity: 0; }
}
</style>
</head>

<body>

<div class="scene">

  <div class="waves">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>

  <div class="orb"></div>

  <div class="text">
    <div>Listen.</div>
    <div>Breathe.</div>
    <div>Rest.</div>
  </div>

  <div class="footer">
    <a href="https://apps.apple.com/vn/app/white-noise-with-night-light/id6744912351/">App Store</a>
    <a href="privacy.html">Privacy</a>
    <a href="support.html">Support</a>
  </div>

</div>

</body>
</html>
